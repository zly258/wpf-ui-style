name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Contrast check
        run: python tools/ContrastCheck.py

      - name: Layout check
        run: python tools/LayoutCheck.py --root .

      - name: Theme contract tests
        run: dotnet test tests/WpfStyleContractTests.csproj --nologo

      - name: Preview build
        run: dotnet build preview/WpfStylePreview.csproj --nologo
